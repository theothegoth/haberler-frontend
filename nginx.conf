    server {
        listen 80;
        server_name gastehub.com www.gastehub.com;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name gastehub.com www.gastehub.com;

        ssl_certificate /etc/letsencrypt/live/gastehub.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gastehub.com/privkey.pem;

        root /usr/share/nginx/html;
        index index.html;

        add_header Permissions-Policy "geolocation=(), midi=(), sync-xhr=(), microphone=(), camera=(), magnetometer=(), gyroscope=(), fullscreen=(self), payment=(), usb=(), bluetooth=()";


    # Allow TinyMCE files - MUST be before generic / location
    location /tinymce/ {
        alias /usr/share/nginx/html/tinymce/;
        expires 1y;
        add_header Cache-Control "public";
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

        location /api {
            proxy_pass http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Forwarded-Proto https;
        }
        
        # Cache static assets
        location /static {
            expires 1y;
            add_header Cache-Control "public";
        }
    }
